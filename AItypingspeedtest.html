<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Typing Test</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<input type="text" id="inputField">

<div class="container">

    <div class="heading">
        <h2>AI TYPING TEST</h2>
        <div class="status">● SYSTEM READY</div>
    </div>

    <div class="typing-area">
        <p id="paragraph"></p>
    </div>

    <div class="stats">

        <div class="box">
            <span>TIME LEFT</span>
            <h3><span id="time">60</span>s</h3>
        </div>

        <div class="box">
            <span>MISTAKES</span>
            <h3 id="mistakes">0</h3>
        </div>

        <div class="box">
            <span>WPM</span>
            <h3 id="wpm">0</h3>
        </div>

        <div class="box">
            <span>CPM</span>
            <h3 id="cpm">0</h3>
        </div>

        <button id="resetBtn">Try Again</button>

    </div>

</div>

<script src="speedtest.js"></script>

</body>
</html>
